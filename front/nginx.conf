# 프로덕션 프론트 (Dockerfile.prod) — 정적 파일 서빙 + /api·/ws 를 백엔드(daphne)로 프록시.
# 개발에서는 vite 가 같은 역할을 한다 (vite.config.ts proxy). 브라우저는 항상 이 서버 하나만 본다.
#
# 백엔드 컨테이너 이름은 배포용 compose 의 서비스명(web)과 맞춘다. 다르면 BACKEND_UPSTREAM 만 바꾼다.

upstream backend {
    server web:8000;
}

# WebSocket 업그레이드 — Connection 헤더를 요청에 따라 "upgrade" / "" 로
map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      close;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # 업로드는 S3 presigned URL 로 직접 가므로 API 본문은 작다
    client_max_body_size 2m;

    # ---- API (REST) ------------------------------------------------------
    location /api/ {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # ---- WebSocket (chat, notifications) -----------------------------------
    # Origin 은 그대로 전달된다 — 백엔드 ALLOWED_HOSTS 에 이 서버의 호스트명이 있어야 한다
    location /ws/ {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 채팅은 오래 열려 있으므로 idle 타임아웃을 길게
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # 헬스체크 (백엔드) — 로드밸런서용
    location = /health/ {
        proxy_pass http://backend;
        proxy_set_header Host $host;
    }

    # ---- 정적 ---------------------------------------------------------------
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA — 나머지 경로는 index.html (React Router 가 처리)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
