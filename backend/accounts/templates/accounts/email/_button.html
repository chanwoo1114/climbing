{# CTA 버튼 — hold-500(코발트) 배경, 흰 글씨. 메일 한 통에 하나만. #}
<table role="presentation" cellpadding="0" cellspacing="0" border="0" style="margin:24px 0 20px;">
  <tr>
    <td style="border-radius:12px;background-color:#2456d6;">
      <a href="{{ link }}" target="_blank"
         style="display:inline-block;padding:14px 26px;font-family:-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR','Segoe UI',Roboto,sans-serif;font-size:15px;font-weight:600;line-height:20px;color:#ffffff;text-decoration:none;border-radius:12px;">
        {{ label }}
      </a>
    </td>
  </tr>
</table>
<p style="margin:0 0 6px;font-size:13px;line-height:20px;color:#6f777d;">
  버튼이 눌리지 않으면 아래 주소를 복사해 브라우저에 붙여넣어 주세요.
</p>
<p style="margin:0;font-size:12px;line-height:18px;word-break:break-all;">
  <a href="{{ link }}" target="_blank" style="color:#1c46b0;text-decoration:underline;">{{ link }}</a>
</p>
